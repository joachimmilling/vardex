# What this pack's agent may do, and what it may spend doing it. A tool that is not listed
# here cannot be called at all, whichever channel asks: the CLI, an MCP client or an eval.
#
#   read     looks something up and changes nothing
#   draft    writes a proposal for a person, and nothing else
#   approve  does it, once a person has said yes to this exact call
#   act      does it
#
# Run `vardex tools packs/norwegian-companies` to see every tool and its level, and
# `vardex check` to catch a tool that has none.

budgets:
  per_run: 0.50   # one question, however many steps it takes
  per_day: 20.00  # this pack, every channel and every scheduled run, since midnight

# Who decides on a proposal, and how long they have. A proposal nobody answers is not a
# decision waiting to be made; it is a decision nobody is going to make, resting on figures
# that are getting older. So it expires, and somebody hears about it first.
approvals:
  approvers: [joachim]      # on one person's machine, this is the list
  needed_within_hours: 72   # the deadline a run puts on what it drafts
  expire_after_days: 14
  escalate_to: joachim

tools:
  # Reading the warehouse
  describe_tool: read
  list_tables: read
  describe_table: read
  run_sql: read
  # Drawing what has been read. The file lands in the pack's own data folder, so this
  # changes nothing outside Vardex.
  make_chart: read
  # Reading the documents
  search_documents: read
  read_passage: read
  # The team's own notes, through the MCP server in mcp.yaml
  notes__search_notes: read
  # Changing something outside Vardex. The CRM connector is a file until there is a CRM.
  # `approve` means this: an agent with somebody at the keyboard may ask them and act; an
  # agent with nobody there may only draft, and the proposal waits in the inbox until a
  # person approves it with `vardex approve`. Same level, two ways of being answered.
  adjust_credit_limit: approve
