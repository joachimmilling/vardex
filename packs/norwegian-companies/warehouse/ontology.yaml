# The objects a question about Norwegian companies is about, and how they link. Each object is
# a model that already exists in the warehouse; this file describes it and never creates
# anything. Vardex checks on every ingest that every key is unique and every link finds its
# object. The values of the columns under values are listed for the model, so its filters
# spell them as the warehouse does.
objects:
  - name: Company
    description: A legal entity in the Central Coordinating Register for Legal Entities.
    table: dim_companies
    key: orgnr
    label: name
    values: [county, legal_form]

  - name: AnnualAccounts
    description: >
      One set of annual accounts for one fiscal year: a company's own, or a parent company's
      for its whole group.
    table: fct_accounts
    key: accounts_key
    values: [accounts_type, currency]

  - name: Industry
    description: An SN2025 industry subclass, with its division and section.
    table: dim_industries
    key: industry_code
    label: industry
    values: [section_code, section]

links:
  - name: filed_by
    description: The company that filed the accounts.
    from: AnnualAccounts.orgnr
    to: Company

  - name: main_industry
    description: The company's main industry. Empty for a company that has not stated one.
    from: Company.industry_code
    to: Industry

# Things the agent can ask to have done to an object, rather than only read about it. An
# action names the object it acts on, the fields it needs and the sentence a person is asked
# to approve. What it is allowed to do is in permissions.yaml, not here: this file says what
# the action is, that one says who may use it and how far.
actions:
  - name: adjust_credit_limit
    description: Propose a new credit limit for a company we sell to.
    object: Company
    connector: crm
    confirm: >-
      Set the credit limit of {label} ({key}) to {amount} NOK, from today, because {reason}.
    fields:
      - name: amount
        description: The new limit in whole NOK.
        type: amount
      - name: reason
        description: >-
          Why, in one sentence a credit controller can check: name the figures it rests on
          and the year they are from. It follows the word "because", so start it in lower
          case (unless it starts with a name) and leave out the full stop.
        type: text
      - name: urgency
        description: normal for the next review, urgent to be looked at today.
        type: choice
        choices: [normal, urgent]
        required: false
