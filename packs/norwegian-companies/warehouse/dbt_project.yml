# The pack's dbt project: SQL that turns raw tables into the warehouse's models.
# Vardex runs it on every ingest; the raw tables come from ingest.yaml.
name: norwegian_companies
version: 0.1.0
profile: vardex
config-version: 2

model-paths: [models]
test-paths: [tests]

models:
  norwegian_companies:
    staging:
      +materialized: view
    marts:
      +materialized: table
