# Lint, test and replay the evals on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # A throwaway PostgreSQL with pgvector, so the tests also run against a warehouse
      # someone else runs, and against a real index of documents
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VARDEX_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install the project
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Check formatting
        run: uv run ruff format --check
      - name: Test
        run: uv run pytest
      - name: Evals, replayed from the recordings
        # No API key, no warehouse, no index and no embedding model: the answers, rows,
        # vectors and passages come from evals/recordings/.
        # Fails when a recording is stale, below a suite's threshold, or on a critical case.
        run: uv run vardex eval packs/norwegian-companies --replay
