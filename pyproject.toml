[project]
name = "vardex"
version = "0.2.0"
description = "Blocks, recipes and packs for enterprise AI apps"
readme = "README.md"
authors = [
    { name = "joachimmilling", email = "joachimmilling@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.scripts]
vardex = "vardex.cli:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
