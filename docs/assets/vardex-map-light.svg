<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 552" width="1000" height="552" role="img" aria-label="Map of Vardex and the release that adds each block. Packs on top plug into the engine, which has five layers (channels, capabilities, models, data, foundation) and three columns through every layer: evals, tracing and guardrails. Vardex 1.0 frames the whole map. Released up to 0.3; dashed blocks are planned. The blocks: Norwegian companies pack (0.1), Your own pack (0.14), CLI (0.1), Web app, API (0.12), MCP server (0.8), Approval inbox (0.9), Text-to-SQL (0.5), Cited answers (0.7), Agent, tools (0.8), Workflows (0.9), Model client (0.2), Prompts (0.3), Open models (0.11), Warehouse (0.4), Document index (0.7), Package (0.1), Deployment (0.12), Evals (0.6), Tracing (0.10), Guardrails (0.13)."><title>Map of Vardex and the release that adds each block. Packs on top plug into the engine, which has five layers (channels, capabilities, models, data, foundation) and three columns through every layer: evals, tracing and guardrails. Vardex 1.0 frames the whole map. Released up to 0.3; dashed blocks are planned. The blocks: Norwegian companies pack (0.1), Your own pack (0.14), CLI (0.1), Web app, API (0.12), MCP server (0.8), Approval inbox (0.9), Text-to-SQL (0.5), Cited answers (0.7), Agent, tools (0.8), Workflows (0.9), Model client (0.2), Prompts (0.3), Open models (0.11), Warehouse (0.4), Document index (0.7), Package (0.1), Deployment (0.12), Evals (0.6), Tracing (0.10), Guardrails (0.13).</title><style>
